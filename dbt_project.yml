name: 'my_new_project'
version: '1.0.0'
config-version: 2

# dbt'nin kullanacağı profile
profile: 'default'

# Proje klasörleri
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# dbt tarafından oluşturulan derlenmiş dosyaların konumu
target-path: "target"

# `dbt clean` çalıştırıldığında silinecek klasörler
clean-targets:
  - "target"
  - "dbt_packages"

# Model yapılandırmaları
models:
  my_new_project:
    mart:
      +materialized: table
      finance:
        +schema: finance